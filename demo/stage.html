<!doctype html>
<!--
  Demo stage: narration on the left (1/3), the app on the right (2/3), both slightly turned
  toward each other in 3D. Each new step flips the narration card like a slide.
  demo/record.mjs drives the app (inside the iframe) and calls window.setStep(...).
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Ingestro demo</title>
    <style>
      :root {
        /* Warm Charcoal, same palette as the app */
        --ink: #ede1bb;
        --muted: #aa9e8a;
        --accent: #ec8743;
        --line: #45423c;
        --surface: #31302e;
        /* The app renders at this width, then is scaled to fit its 2/3 of the stage. */
        --app-w: 1500px;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; color: var(--ink);
        background: radial-gradient(1400px 900px at 50% 40%, #2e2d2b 0%, #232220 60%, #1c1b19 100%); }
      .stage { display: grid; grid-template-columns: 1fr 2fr; height: 100vh; perspective: 2400px; perspective-origin: 34% 50%; }

      /* ---- narration (left third): its right edge leans back, so it faces the app  ( / ) ---- */
      aside { padding: 64px 40px 56px 64px; display: flex; flex-direction: column; gap: 28px; transform-style: preserve-3d; }
      .brand { font-weight: 700; letter-spacing: 0.08em; color: var(--muted); font-size: 14px; }
      .card-wrap { transform: rotateY(8deg); transform-origin: left center; transform-style: preserve-3d; }
      .card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 36px; display: flex; flex-direction: column; gap: 20px;
        box-shadow: 0 30px 60px -24px rgba(0, 0, 0, 0.6); backface-visibility: hidden; transform-origin: center; }
      .card.out { animation: flipOut 0.28s ease-in forwards; }
      .card.in { animation: flipIn 0.38s cubic-bezier(0.2, 0.8, 0.3, 1) forwards; }
      @keyframes flipOut { to { transform: rotateY(-90deg) translateZ(40px); opacity: 0.6; } }
      @keyframes flipIn { from { transform: rotateY(90deg) translateZ(40px); opacity: 0.6; } to { transform: rotateY(0) translateZ(0); opacity: 1; } }
      .kicker { font-size: 14px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.1em; }
      h1 { margin: 0; font-size: 34px; line-height: 1.22; font-weight: 750; letter-spacing: -0.01em; }
      ul { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 12px; font-size: 20px; line-height: 1.45; }
      .how { font-size: 16px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; line-height: 1.5; }
      .how b { color: var(--ink); font-weight: 600; }
      .progress { display: flex; gap: 6px; margin-top: auto; }
      .progress span { flex: 1; height: 5px; border-radius: 3px; background: #45423c; transition: background 0.3s; }
      .progress span.on { background: var(--accent); }

      /* ---- app (right two thirds): its left edge leans back, so it faces the narration  ( \ ) ---- */
      .app { padding: 40px 56px 40px 24px; display: flex; align-items: center; justify-content: center; transform-style: preserve-3d; }
      .screen { width: 100%; height: 100%; transform: rotateY(-8deg); transform-origin: right center; border-radius: 10px; overflow: hidden; background: #282828;
        border: 1px solid var(--line); box-shadow: 0 50px 90px -30px rgba(0, 0, 0, 0.7); position: relative;
        transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.3, 1); }
      .screen.nudge { transform: rotateY(-5deg) translateZ(20px); }
      .screen iframe { position: absolute; top: 0; left: 0; border: 0; width: var(--app-w); transform-origin: top left; background: #282828; }
    </style>
  </head>
  <body>
    <div class="stage">
      <aside>
        <div class="brand">INGESTRO · REVIEW &amp; FIX</div>
        <div class="card-wrap">
          <div class="card" id="card">
            <div class="kicker" id="kicker"></div>
            <h1 id="title"></h1>
            <ul id="bullets"></ul>
            <div class="how" id="how"></div>
          </div>
        </div>
        <div class="progress" id="progress"></div>
      </aside>
      <div class="app">
        <div class="screen" id="screen"><iframe id="app" title="Ingestro app"></iframe></div>
      </div>
    </div>
    <script>
      const $ = (id) => document.getElementById(id)

      // Fit the app (rendered at --app-w) into the screen.
      function fit() {
        // Layout size, not getBoundingClientRect: the 3D tilt would shrink the measured box.
        const screen = $('screen')
        const appW = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--app-w'))
        const scale = screen.offsetWidth / appW
        const frame = $('app')
        frame.style.transform = `scale(${scale})`
        frame.style.height = `${screen.offsetHeight / scale}px`
      }
      addEventListener('resize', fit)
      fit()

      function render({ kicker, title, bullets = [], how = '', index, total }) {
        $('kicker').textContent = kicker
        $('title').textContent = title
        $('bullets').innerHTML = bullets.map((b) => `<li>${b}</li>`).join('')
        $('how').innerHTML = how
        $('how').style.display = how ? '' : 'none'
        $('progress').innerHTML = Array.from({ length: total }, (_, i) => `<span class="${i <= index ? 'on' : ''}"></span>`).join('')
      }

      let first = true
      window.setStep = (step) => {
        const card = $('card')
        if (first) {
          first = false
          render(step)
          card.className = 'card in'
          return
        }
        // Slide flip: turn the card away, swap the content, turn the new one in.
        card.className = 'card out'
        setTimeout(() => {
          render(step)
          card.className = 'card in'
        }, 280)
        // The app screen leans in a little on every new feature.
        const screen = $('screen')
        screen.classList.add('nudge')
        setTimeout(() => screen.classList.remove('nudge'), 650)
      }
    </script>
  </body>
</html>
